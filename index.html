<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FitApp">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>FitApp – trening i dieta</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --text:#14161a; --muted:#6b7280; --line:#e5e7eb;
  --accent:#16a34a; --accent2:#2563eb; --warn:#ea580c; --danger:#dc2626;
  --p:#2563eb; --c:#f59e0b; --f:#db2777; --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1115; --card:#181b21; --text:#eef0f3; --muted:#9aa1ac; --line:#2a2e36;}
}
*{box-sizing:border-box;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 8px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:20px;margin:0}
main{max-width:720px;margin:0 auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:0 0 12px}
.card h2{font-size:16px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 0;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:8px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.blue{background:var(--accent2);border-color:var(--accent2);color:#fff}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:4px 8px}
button.danger{color:var(--danger)}
button:disabled{opacity:.5}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
label > input,label > select{margin-top:3px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);padding:4px 6px;gap:2px}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--accent);font-weight:600}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.big{font-size:28px;font-weight:700;line-height:1.1}
.stat{text-align:center}
.stat b{display:block;font-size:18px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--text)}
.datenav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.datenav b{font-size:16px}
.ring{position:relative;width:120px;height:120px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.sets{width:100%;border-collapse:collapse}
.sets td,.sets th{padding:3px 4px;text-align:center;font-size:13px}
.sets th{color:var(--muted);font-weight:500}
.sets input{padding:6px;text-align:center}
.sets tr.done input{background:color-mix(in srgb,var(--accent) 15%,var(--bg))}
.chk{width:30px;height:30px;padding:0;border-radius:8px}
.chk.on{background:var(--accent);color:#fff;border-color:var(--accent)}
dialog{border:0;border-radius:var(--radius);padding:0;background:var(--card);color:var(--text);width:min(520px,calc(100% - 24px));max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog .body{padding:16px;overflow:auto;max-height:88vh}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chips button{padding:4px 10px;font-size:13px;border-radius:99px}
.suggest{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin:4px 0 10px}
.suggest div{padding:8px 10px;cursor:pointer;border-top:1px solid var(--line);display:flex;justify-content:space-between}
.suggest div:first-child{border-top:0}
.suggest div:hover{background:var(--bg)}
svg text{fill:var(--muted);font-size:11px}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:16px 0}
.water{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.water span{width:22px;height:30px;border-radius:4px 4px 8px 8px;border:2px solid var(--accent2);opacity:.35}
.water span.f{background:var(--accent2);opacity:1}
button.dangerfill{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#14161a;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:100;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.3);transition:opacity .4s}
.toast.out{opacity:0}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.runbig{text-align:center;padding:10px 0}
.runbig .t{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.runbig .g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.runbig .g b{display:block;font-size:30px;font-variant-numeric:tabular-nums}

/* ===== Ekran ładowania ===== */
#splash{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(circle at 50% 35%,#22c55e 0%,#16a34a 45%,#0d6b31 100%);color:#fff;transition:opacity .45s ease,transform .45s ease}
#splash.hide{opacity:0;transform:scale(1.06);pointer-events:none}
#splash .logo{width:120px;height:120px;border-radius:30px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 40px rgba(0,0,0,.25),inset 0 0 0 1px rgba(255,255,255,.25);animation:logoIn .6s cubic-bezier(.2,1.4,.4,1) both}
#splash .logo svg{width:78px;animation:lift 1.1s ease-in-out .3s infinite}
#splash .brand{font-size:30px;font-weight:800;letter-spacing:.5px;animation:fadeUp .5s ease .2s both}
#splash .tag{font-size:14px;opacity:.85;margin-top:-12px;animation:fadeUp .5s ease .3s both}
#splash .load{width:140px;height:5px;border-radius:5px;background:rgba(255,255,255,.25);overflow:hidden;animation:fadeUp .5s ease .35s both}
#splash .load i{display:block;height:100%;width:40%;border-radius:5px;background:#fff;animation:slide 1s ease-in-out infinite}
@keyframes logoIn{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@keyframes lift{0%,100%{transform:translateY(6px) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}

/* ===== Zmiana zakładek ===== */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
#app{overflow-x:clip}
#app.anim-fwd > *{animation:inR .38s cubic-bezier(.2,.8,.2,1) both}
#app.anim-back > *{animation:inL .38s cubic-bezier(.2,.8,.2,1) both}
#app.anim-fwd > :nth-child(2),#app.anim-back > :nth-child(2){animation-delay:.05s}
#app.anim-fwd > :nth-child(3),#app.anim-back > :nth-child(3){animation-delay:.1s}
#app.anim-fwd > :nth-child(4),#app.anim-back > :nth-child(4){animation-delay:.15s}
#app.anim-fwd > :nth-child(5),#app.anim-back > :nth-child(5){animation-delay:.2s}
#app.anim-fwd > :nth-child(n+6),#app.anim-back > :nth-child(n+6){animation-delay:.25s}
@keyframes ringIn{from{stroke-dasharray:0 999}}
@keyframes barIn{from{width:0}}
#app[class*=anim] .ring .prog{animation:ringIn .9s cubic-bezier(.2,.8,.2,1) .1s both}
#app[class*=anim] .bar > i{animation:barIn .8s cubic-bezier(.2,.8,.2,1) .15s both}
header h1.anim{animation:fadeUp .3s ease both}

/* ===== Dolny pasek ===== */
nav button .ic{padding:4px 14px;border-radius:99px;transition:background .25s}
nav button.on .ic{background:color-mix(in srgb,var(--accent) 16%,transparent);animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
nav button:active .ic{transform:scale(.88)}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}

/* ===== Okna, przyciski, kręciołek ===== */
dialog[open]{animation:dlgIn .25s cubic-bezier(.2,1.2,.4,1)}
dialog[open]::backdrop{animation:fadeIn .25s ease}
@keyframes dlgIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}}
button{transition:transform .12s ease,filter .15s}
button:active:not(:disabled){transform:scale(.96);filter:brightness(.95)}
.seg button{transition:background .25s,color .25s,box-shadow .25s}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;
  vertical-align:-3px;margin-right:6px;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.toast{animation:fadeUp .3s ease}

@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important} }
</style>
</head>
<body>
<header><h1 id="title">Dziś</h1><span class="muted small" id="hdate"></span></header>
<div id="splash" aria-hidden="true">
  <div class="logo"><svg viewBox="0 0 100 60" fill="#fff"><rect x="22" y="26" width="56" height="8" rx="2"/><rect x="14" y="10" width="11" height="40" rx="4"/><rect x="75" y="10" width="11" height="40" rx="4"/><rect x="6" y="18" width="8" height="24" rx="3"/><rect x="86" y="18" width="8" height="24" rx="3"/></svg></div>
  <div class="brand">FitApp</div><div class="tag">trening · dieta · bieganie</div>
  <div class="load"><i></i></div>
</div>
<main id="app"></main>

<nav id="nav">
  <button data-tab="today"><span class="ic">🏠</span>Dziś</button>
  <button data-tab="diet"><span class="ic">🥗</span>Dieta</button>
  <button data-tab="workout"><span class="ic">🏋️</span>Trening</button>
  <button data-tab="progress"><span class="ic">📈</span>Postępy</button>
  <button data-tab="settings"><span class="ic">⚙️</span>Ustawienia</button>
</nav>

<dialog id="dlg"><div class="body" id="dlgBody"></div></dialog>
<dialog id="ask" style="width:min(400px,calc(100% - 32px))"></dialog>

<script>
/* ================== DANE ================== */
const KEY = 'fitapp.v1';
const MEALS = [['breakfast','Śniadanie'],['lunch','Obiad'],['dinner','Kolacja'],['snack','Przekąski']];
const DEFAULT_FOODS = [
  // nazwa, kcal, białko, węgle, tłuszcz (na 100 g)
  ['Pierś z kurczaka',110,23,0,1.3],['Ryż biały (suchy)',350,7,78,0.6],['Płatki owsiane',370,13,60,7],
  ['Jajko',140,12.5,0.7,10],['Banan',89,1.1,23,0.3],['Jabłko',52,0.3,14,0.2],['Twaróg półtłusty',133,18,3.7,4.7],
  ['Jogurt naturalny',60,4.3,6,2],['Skyr naturalny',63,11,4,0],['Mleko 2%',50,3.4,4.8,2],['Chleb pełnoziarnisty',250,9,43,3.5],
  ['Makaron (suchy)',350,12,71,1.5],['Ziemniaki',77,2,17,0.1],['Kasza gryczana (sucha)',343,13,72,3.4],
  ['Oliwa z oliwek',884,0,0,100],['Masło orzechowe',590,25,20,50],['Łosoś',208,20,0,13],['Wołowina chuda',150,22,0,7],
  ['Tuńczyk w sosie własnym',116,26,0,1],['Brokuł',34,2.8,7,0.4],['Pomidor',18,0.9,3.9,0.2],['Ogórek',15,0.7,3.6,0.1],
  ['Ser żółty',350,26,0,27],['Odżywka białkowa',380,75,8,6],['Awokado',160,2,9,15],['Orzechy włoskie',654,15,14,65],
  ['Masło',740,0.7,0.7,82],['Ser mozzarella',250,18,2,19],['Indyk (pierś)',105,24,0,1],['Truskawki',32,0.7,7.7,0.3]
].map(([name,kcal,p,c,f])=>({name,kcal,p,c,f}));
const DEFAULT_EXERCISES = ['Przysiad ze sztangą','Wyciskanie sztangi na ławce','Martwy ciąg','Wyciskanie żołnierskie (OHP)',
  'Wiosłowanie sztangą','Podciąganie','Pompki','Dipy','Wykroki','Hip thrust','Uginanie ramion ze sztangą',
  'Prostowanie ramion na wyciągu','Ściąganie drążka wyciągu','Wyciskanie hantli skos','Wznosy bokiem','Prasa nóg',
  'Uginanie nóg na maszynie','Wspięcia na palce','Plank (sek.)','Bieg (min)','Rower (min)'];
const DEFAULT_TEMPLATES = [
  {name:'Push (klatka/barki/triceps)',exercises:['Wyciskanie sztangi na ławce','Wyciskanie żołnierskie (OHP)','Wyciskanie hantli skos','Wznosy bokiem','Prostowanie ramion na wyciągu']},
  {name:'Pull (plecy/biceps)',exercises:['Martwy ciąg','Podciąganie','Wiosłowanie sztangą','Ściąganie drążka wyciągu','Uginanie ramion ze sztangą']},
  {name:'Legs (nogi)',exercises:['Przysiad ze sztangą','Prasa nóg','Wykroki','Uginanie nóg na maszynie','Wspięcia na palce']},
  {name:'FBW (całe ciało)',exercises:['Przysiad ze sztangą','Wyciskanie sztangi na ławce','Wiosłowanie sztangą','Wyciskanie żołnierskie (OHP)','Plank (sek.)']}
];

function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s) return s; }catch(e){}
  return {
    settings:{kcal:2200,p:150,c:240,f:70,water:2500,sex:'m',age:25,height:178,weight:75,activity:1.55,goal:'keep',weeklyWorkouts:3,weeklyKm:15},
    meals:{}, water:{}, foods:DEFAULT_FOODS, exercises:DEFAULT_EXERCISES, templates:DEFAULT_TEMPLATES,
    workouts:[], weights:[], runs:[], active:null, activeRun:null
  };
}
function norm(d){ d.runs=d.runs||[]; d.activeRun=d.activeRun||null; if(d.settings.weeklyKm==null) d.settings.weeklyKm=15; return d; }
let S = norm(load());
let saveWarned=false;
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){
  if(!saveWarned){ saveWarned=true; toast('⚠️ Ta przeglądarka nie pozwala zapisywać danych – po odświeżeniu znikną. Otwórz plik w Chrome lub Edge.',6000); } } }

/* ===== własne okienka zamiast alert/confirm/prompt (te bywają blokowane, np. w przeglądarkach wbudowanych w aplikacje) ===== */
function toast(msg,ms=2600){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.classList.add('out'),ms); setTimeout(()=>t.remove(),ms+400);
}
function ask(msg,{ok='Tak',cancel='Anuluj',danger=false,input=null}={}){
  return new Promise(resolve=>{
    const d=document.getElementById('ask');
    d.innerHTML=`<div class="body"><p style="margin-top:0">${esc(msg)}</p>
      ${input!==null?`<input id="askIn" value="${esc(input)}" style="margin-bottom:12px">`:''}
      <div class="row" style="justify-content:flex-end"><button id="askNo">${esc(cancel)}</button><button id="askOk" class="${danger?'dangerfill':'primary'}">${esc(ok)}</button></div></div>`;
    let done=false; const fin=v=>{ if(done) return; done=true; d.close(); resolve(v); };
    d.querySelector('#askNo').onclick=()=>fin(input!==null?null:false);
    d.querySelector('#askOk').onclick=()=>fin(input!==null?d.querySelector('#askIn').value.trim():true);
    d.onclose=()=>fin(input!==null?null:false);
    d.showModal(); (d.querySelector('#askIn')||d.querySelector('#askOk')).focus();
  });
}

/* ================== POMOCNICZE ================== */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const r0 = n => Math.round(n||0), r1 = n => Math.round((n||0)*10)/10;
const dkey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayKey = () => dkey(new Date());
const parseKey = k => { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (k,n) => { const d=parseKey(k); d.setDate(d.getDate()+n); return dkey(d); };
const fmtDate = k => parseKey(k).toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'});
const fmtShort = k => parseKey(k).toLocaleDateString('pl-PL',{day:'numeric',month:'short'});
const num = v => { const n=parseFloat(String(v).replace(',','.')); return isFinite(n)?n:0; };

function dayTotals(k){
  const t={kcal:0,p:0,c:0,f:0};
  (S.meals[k]||[]).forEach(m=>{t.kcal+=m.kcal;t.p+=m.p;t.c+=m.c;t.f+=m.f;});
  return t;
}
function weekStart(k){ const d=parseKey(k); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return dkey(d); }
function workoutVolume(w){ let v=0; w.exercises.forEach(e=>e.sets.forEach(s=>{ if(s.done!==false) v+=num(s.reps)*num(s.weight); })); return v; }
function fmtDur(sec){ sec=Math.max(0,Math.floor(sec)); const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(s).padStart(2,'0'); }
function bar(val,max,color){ const p=max?Math.min(100,val/max*100):0; return `<div class="bar"><i style="width:${p}%;${color?'background:'+color:''}${val>max*1.05?';background:var(--warn)':''}"></i></div>`; }
function ring(val,max){
  const R=52,C=2*Math.PI*R,p=max?Math.min(1,val/max):0,over=val>max*1.05;
  return `<div class="ring"><svg width="120" height="120"><circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--line)" stroke-width="12"/>
  <circle cx="60" cy="60" r="${R}" fill="none" stroke="${over?'var(--warn)':'var(--accent)'}" stroke-width="12" stroke-linecap="round" class="prog" stroke-dasharray="${C*p} ${C}"/></svg>
  <div><b style="font-size:22px">${r0(Math.max(0,max-val))}</b><span class="small muted">${val>max?'ponad cel':'kcal zostało'}</span></div></div>`;
}

/* ================== WYKRESY (SVG) ================== */
function lineChart(pts, unit){
  if(pts.length<2) return '<div class="empty small">Dodaj co najmniej 2 pomiary, żeby zobaczyć wykres.</div>';
  const W=600,H=200,pl=36,pr=10,pt=10,pb=24;
  const ys=pts.map(p=>p.y); let mn=Math.min(...ys),mx=Math.max(...ys); if(mx-mn<1){mn-=0.5;mx+=0.5;}
  const pad=(mx-mn)*0.1; mn-=pad; mx+=pad;
  const x=i=>pl+i*(W-pl-pr)/(pts.length-1), y=v=>pt+(mx-v)*(H-pt-pb)/(mx-mn);
  const d=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(p.y).toFixed(1)).join('');
  let grid=''; for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3; grid+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-4}" y="${y(v)+4}" text-anchor="end">${r1(v)}</text>`;}
  const step=Math.ceil(pts.length/6); let lbl='';
  pts.forEach((p,i)=>{ if(i%step===0||i===pts.length-1) lbl+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${esc(p.label)}</text>`; });
  const dots=pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.y)}" r="3.5" fill="var(--accent)"><title>${esc(p.label)}: ${p.y} ${unit}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${grid}<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>${dots}${lbl}</svg>`;
}
function barChart(items, goal, color){
  const W=600,H=180,pl=36,pr=10,pt=10,pb=24;
  const mx=Math.max(goal||0,...items.map(i=>i.v),1)*1.1;
  const bw=(W-pl-pr)/items.length;
  const y=v=>pt+(mx-v)*(H-pt-pb)/mx;
  let s='';
  items.forEach((it,i)=>{ const h=H-pb-y(it.v);
    s+=`<rect x="${pl+i*bw+bw*0.18}" y="${y(it.v)}" width="${bw*0.64}" height="${Math.max(0,h)}" rx="4" fill="${goal&&it.v>goal*1.05?'var(--warn)':color}"><title>${esc(it.label)}: ${r0(it.v)}</title></rect>
    <text x="${pl+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${esc(it.label)}</text>`; });
  if(goal) s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--muted)" stroke-dasharray="5 4"/><text x="${pl-4}" y="${y(goal)+4}" text-anchor="end">${r0(goal)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${s}</svg>`;
}

let scanStop=null;
function scanDialog(type){
  openDlg(`<h2 style="margin-top:0">📷 Skanuj kod kreskowy</h2>
    <video id="scV" playsinline muted style="width:100%;border-radius:10px;background:#000;aspect-ratio:4/3;object-fit:cover"></video>
    <div id="scMsg" class="small muted" style="margin:6px 0 10px">Uruchamiam kamerę… Skieruj ją na kod EAN na opakowaniu.</div>
    <label>albo wpisz numer kodu ręcznie
      <div class="row" style="margin-top:3px"><input id="scCode" inputmode="numeric" class="grow" placeholder="np. 5900820000011"><button class="blue" id="scGo">Szukaj</button></div></label>
    <div class="row" style="justify-content:space-between"><button id="scBack">‹ Wróć</button><button data-close>Anuluj</button></div>`);
  const msg=t=>{ const el=$('#scMsg'); if(el) el.textContent=t; };
  const found=code=>{ stopScan(); $('#scCode').value=code; lookupBarcode(code,type,msg); };
  $('#scGo').onclick=()=>{ const c=$('#scCode').value.replace(/\D/g,''); if(c.length>=6) found(c); else msg('Kod jest za krótki.'); };
  $('#scBack').onclick=()=>{ stopScan(); mealDialog(type); };
  startScan($('#scV'),found).catch(e=>msg('Nie udało się włączyć kamery ('+e.message+'). Wpisz kod ręcznie poniżej.'));
}
function stopScan(){ if(scanStop){ try{scanStop();}catch(e){} scanStop=null; } }
async function startScan(video,onCode){
  if(!navigator.mediaDevices?.getUserMedia) throw new Error('przeglądarka nie obsługuje kamery');
  if('BarcodeDetector' in window){
    const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject=stream; await video.play();
    let alive=true; scanStop=()=>{ alive=false; stream.getTracks().forEach(t=>t.stop()); };
    const loop=async()=>{ if(!alive) return;
      try{ const r=await det.detect(video); if(r.length) return onCode(r[0].rawValue); }catch(e){}
      setTimeout(loop,250); };
    return loop();
  }
  // przeglądarki bez BarcodeDetector (np. Chrome na Windows, Safari) – biblioteka ZXing
  const {BrowserMultiFormatReader}=await import('https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm');
  const reader=new BrowserMultiFormatReader();
  const ctrl=await reader.decodeFromConstraints({video:{facingMode:'environment'}},video,(res)=>{ if(res) onCode(res.getText()); });
  scanStop=()=>ctrl.stop();
}
async function lookupBarcode(code,type,msg){
  const local=S.foods.find(f=>f.barcode===code);
  if(local) return mealDialog(type,null,{...local,grams:local.serving||100});
  $('#scMsg').innerHTML='<span class="spin"></span>Szukam produktu '+esc(code)+' w bazie Open Food Facts…';
  try{
    const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,product_name_pl,brands,nutriments,serving_quantity`);
    const d=await r.json();
    if(d.status!==1||!d.product) return msg('Nie znaleziono produktu '+code+'. Dodaj go ręcznie (przycisk „Wróć”).');
    const p=d.product, n=p.nutriments||{};
    const kcal=n['energy-kcal_100g']??(n['energy_100g']!=null?n['energy_100g']/4.184:null);
    if(kcal==null) return msg('Produkt znaleziony, ale bez wartości odżywczych. Wpisz je ręcznie.');
    const name=(p.product_name_pl||p.product_name||'Produkt '+code)+(p.brands?' ('+p.brands.split(',')[0].trim()+')':'');
    const food={name,kcal:r0(kcal),p:r1(n.proteins_100g),c:r1(n.carbohydrates_100g),f:r1(n.fat_100g),barcode:code,serving:num(p.serving_quantity)||null};
    S.foods.push(food); save();
    mealDialog(type,null,{...food,grams:food.serving||100});
  }catch(e){ msg('Brak połączenia z bazą produktów ('+e.message+').'); }
}

/* ================== AI: KALORIE ZE ZDJĘCIA (Claude) ================== */
const AI_MODEL='claude-opus-5-5';
let AnthropicSDK=null;
async function claude(){
  if(!AnthropicSDK) AnthropicSDK=(await import('https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@1.3.0/+esm')).default;
  return new AnthropicSDK({apiKey:S.settings.apiKey,dangerouslyAllowBrowser:true});
}
const FOOD_SCHEMA={type:'object',additionalProperties:false,required:['items','comment'],properties:{
  items:{type:'array',items:{type:'object',additionalProperties:false,required:['name','grams','kcal','protein','carbs','fat'],properties:{
    name:{type:'string'},grams:{type:'number'},kcal:{type:'number'},protein:{type:'number'},carbs:{type:'number'},fat:{type:'number'}}}},
  comment:{type:'string'}}};
function fileToJpeg(file,max=1280){
  return new Promise((res,rej)=>{ const img=new Image();
    img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(img.src); res(c.toDataURL('image/jpeg',0.85)); };
    img.onerror=()=>rej(new Error('Nie można odczytać zdjęcia')); img.src=URL.createObjectURL(file); });
}
async function estimateFromPhoto(b64,hint){
  const client=await claude();
  const req={model:AI_MODEL,max_tokens:16000,
    system:'Jesteś doświadczonym dietetykiem. Szacujesz wartości odżywcze posiłków ze zdjęć. Odpowiadasz po polsku.',
    output_config:{format:{type:'json_schema',schema:FOOD_SCHEMA}},
    messages:[{role:'user',content:[
      {type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},
      {type:'text',text:'Rozpoznaj każdy składnik posiłku na zdjęciu. Dla każdego oszacuj masę porcji w gramach (porównaj z wielkością talerza i sztućców, uwzględnij tłuszcz do smażenia i sosy) oraz kcal, białko, węglowodany i tłuszcz dla TEJ porcji. W polu comment napisz krótko (1–2 zdania), czego jesteś najmniej pewny. Jeśli na zdjęciu nie ma jedzenia, zwróć pustą listę i wyjaśnij to w comment.'+(hint?'\nInformacja od użytkownika: '+hint:'')}
    ]}]};
  let res;
  try{
    // fallbacks: jeśli model odmówi, API samo przełączy się na inny model
    res=await client.beta.messages.create({...req,betas:['server-side-fallback-2026-07-01'],fallbacks:'default'});
  }catch(e){
    if(e.status===400&&/fallback/i.test(e.message)) res=await client.messages.create(req); else throw e;
  }
  if(res.stop_reason==='refusal') throw new Error('Model odmówił analizy tego zdjęcia.');
  if(res.stop_reason==='max_tokens') throw new Error('Odpowiedź została ucięta – spróbuj ponownie.');
  const txt=res.content.find(b=>b.type==='text');
  if(!txt) throw new Error('Brak odpowiedzi od AI.');
  return JSON.parse(txt.text);
}

let wtab='gym', gpsWatch=null, wakeLock=null;
const RUN_TYPES=['Spokojny','Tempowy','Interwały','Długi','Zawody','Bieżnia'];
function haversine(a,b){ const R=6371,rad=x=>x*Math.PI/180, dLa=rad(b.lat-a.lat), dLo=rad(b.lon-a.lon);
  const h=Math.sin(dLa/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function fmtPace(sec,km){ if(!(km>0.01&&sec>0)) return '–:––'; const s=Math.round(sec/km); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
const fmtKm=km=>(Math.round((km||0)*100)/100).toFixed(2).replace('.',',');
const runKcal=km=>Math.round(km*(S.settings.weight||70)*1.0); // ≈ 1 kcal na kg masy ciała na km
function runElapsed(r){ return Math.max(0,((r.paused?r.pausedAt:Date.now())-r.start-r.pausedMs)/1000); }

async function requestWake(){ try{ if(navigator.wakeLock&&!wakeLock){ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{wakeLock=null;}); } }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&S.activeRun&&!S.activeRun.paused) requestWake(); });
function attachGps(){
  if(gpsWatch!==null||!S.activeRun) return;
  requestWake();
  if(!navigator.geolocation){ S.activeRun.gps='none'; return; }
  gpsWatch=navigator.geolocation.watchPosition(onPos,err=>{ if(S.activeRun){ S.activeRun.gps='error';
      S.activeRun.gpsErr=err.code===1?(location.protocol==='https:'?'brak zgody na lokalizację':'lokalizacja działa tylko na stronie https'):err.code===3?'długo szukam sygnału':'nie można ustalić pozycji';
      updRunUI(); } },
    {enableHighAccuracy:true,maximumAge:0,timeout:30000});
}
function detachGps(){ if(gpsWatch!==null){ navigator.geolocation.clearWatch(gpsWatch); gpsWatch=null; } if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock=null; } }
function onPos(p){
  const r=S.activeRun; if(!r) return;
  r.gps='ok'; r.acc=Math.round(p.coords.accuracy);
  if(r.paused){ r.last=null; return updRunUI(); }
  if(p.coords.accuracy>35) return updRunUI();            // zbyt niedokładny odczyt
  const pt={lat:p.coords.latitude,lon:p.coords.longitude,t:p.timestamp};
  if(r.last){
    const d=haversine(r.last,pt), dt=(pt.t-r.last.t)/1000;
    if(d<0.004) return updRunUI();                       // szum GPS w miejscu (<4 m)
    if(dt>0&&d/dt>0.012){ r.last=pt; return updRunUI(); } // skok > 43 km/h – błędny odczyt
    r.km+=d;
  }
  r.last=pt; save(); updRunUI();
}
function updRunUI(){
  const r=S.activeRun, t=$('#rTime'); if(!r||!t) return;
  const sec=runElapsed(r);
  t.textContent=fmtDur(sec); $('#rKm').textContent=fmtKm(r.km); $('#rPace').textContent=fmtPace(sec,r.km);
  $('#rGps').innerHTML=r.gps==='ok'?`🟢 GPS ok (±${r.acc} m)`
    :r.gps==='error'?`🔴 Brak GPS (${esc(r.gpsErr||'')}) – dystans wpiszesz na końcu`
    :r.gps==='none'?'🔴 To urządzenie nie ma GPS – dystans wpiszesz na końcu'
    :'🟡 Szukam sygnału GPS…';
}
function vRunLive(){
  const r=S.activeRun;
  setTimeout(()=>{ updRunUI(); clearInterval(timerInt); timerInt=setInterval(updRunUI,1000); });
  return `<div class="card"><div class="runbig">
    <div class="small muted">${r.paused?'⏸ PAUZA':'🏃 Bieg trwa'}</div>
    <div class="t" id="rTime">0:00</div>
    <div class="g"><div><b id="rKm">0,00</b><span class="small muted">km</span></div><div><b id="rPace">–:––</b><span class="small muted">min/km</span></div></div>
  </div>
  <div class="small muted" id="rGps" style="text-align:center;margin:6px 0 14px"></div>
  <div class="row">${r.paused?'<button class="primary grow" data-act="runResume">▶ Wznów</button>':'<button class="blue grow" data-act="runPause">⏸ Pauza</button>'}

  const sec=Math.round(pre.sec||0), h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;

    <label>Rodzaj biegu<select id="rnT">${RUN_TYPES.map(t=>`<option ${t===(pre.type||'Spokojny')?'selected':''}>${t}</option>`).join('')}</select></label>
    <label>Notatki<input id="rnN" value="${esc(pre.notes||'')}" placeholder="np. samopoczucie, trasa, buty"></label>

    <div class="row" style="justify-content:flex-end"><button data-close>${pre.fromLive?'Wróć do biegu':'Anuluj'}</button><button class="primary" id="rnOk">Zapisz bieg</button></div>`);
  const read=()=>({km:num($('#rnKm').value), sec:num($('#rnH').value)*3600+num($('#rnM').value)*60+num($('#rnS').value)});
  const upd=()=>{ const v=read(); $('#rnOut').innerHTML=v.km>0&&v.sec>0?`Tempo: <b>${fmtPace(v.sec,v.km)} min/km</b> · ${r1(v.km/(v.sec/3600))} km/h · ~${runKcal(v.km)} kcal`:'<span class="muted">Wpisz dystans i czas.</span>'; };
  $('#dlgBody').oninput=upd; upd();
  $('#rnOk').onclick=()=>{

    wtab='run'; save(); closeDlg(); render(); toast(`✅ Zapisano bieg: ${fmtKm(run.km)} km, tempo ${fmtPace(run.sec,run.km)} min/km`);

function runDetails(id){

function runRecords(){
  if(!S.runs.length) return '<div class="empty small">Zapisz pierwszy bieg, żeby zobaczyć rekordy.</div>';
  const best=min=>S.runs.filter(r=>r.km>=min).sort((a,b)=>a.sec/a.km-b.sec/b.km)[0];
  const longest=[...S.runs].sort((a,b)=>b.km-a.km)[0], total=S.runs.reduce((a,r)=>a+r.km,0);
  const rows=[['Łącznie przebiegnięte',`${fmtKm(total)} km`,`${S.runs.length} biegów`],['Najdłuższy bieg',`${fmtKm(longest.km)} km`,fmtShort(longest.date)]];
  [[1,'Najlepsze tempo'],[5,'Najszybsze 5 km'],[10,'Najszybsze 10 km'],[21.1,'Półmaraton']].forEach(([d,n])=>{ const r=best(d); if(!r) return;
    rows.push([n, d===1?`${fmtPace(r.sec,r.km)} min/km`:fmtDur(r.sec/r.km*d), `tempo ${fmtPace(r.sec,r.km)}/km · ${fmtShort(r.date)}`]); });
  return `<ul class="list">${rows.map(([a,b,c])=>`<li><span class="grow">${a}<div class="small muted">${c}</div></span><b>${b}</b></li>`).join('')}</ul>

}

function addWeight(date,kg){
  if(!(kg>20&&kg<400)){ toast('Podaj poprawną wagę w kg.'); return false; }
  S.weights=S.weights.filter(w=>w.date!==date); S.weights.push({date,kg:r1(kg)});
  const latest=[...S.weights].sort((a,b)=>a.date<b.date?-1:1).pop();
  if(latest.date===date){ const s=S.settings; s.weight=r1(kg);
    if(s.profileSet&&s.autoCalc!==false){ const P=computePlan(s); Object.assign(s,{kcal:P.kcal,p:P.p,c:P.c,f:P.f}); } }
  save(); return true;
}

const ACTIVITY=[[1.2,'Siedzący tryb życia, brak treningów'],[1.375,'Lekka (1–3 treningi/tydz.)'],[1.55,'Umiarkowana (3–5 treningów)'],[1.725,'Wysoka (6–7 treningów)'],[1.9,'Bardzo wysoka (praca fizyczna + trening)']];
const GOALS=[['cut_slow','Schudnąć powoli (−0,25 kg/tydz.)'],['cut','Schudnąć (−0,5 kg/tydz.) – zalecane'],['cut_fast','Schudnąć szybko (−0,75 kg/tydz.)'],['keep','Utrzymać wagę'],['bulk','Przytyć / masa (+0,25 kg/tydz.)']];
const GOAL_DELTA={cut_slow:-275,cut:-550,cut_fast:-825,keep:0,bulk:275}; // 1 kg tkanki ≈ 7700 kcal
function computePlan(o){
  const h=o.height/100, bmi=o.weight/(h*h);
  const bmr=10*o.weight+6.25*o.height-5*o.age+(o.sex==='m'?5:-161), tdee=bmr*o.activity;
  let kcal=Math.round((tdee+(GOAL_DELTA[o.goal]??0))/10)*10;
  const floor=Math.max(o.sex==='m'?1500:1200, Math.round(bmr/10)*10); let limited=false;
  if(o.goal.startsWith('cut')&&kcal<floor){ kcal=floor; limited=true; }
  const refW=bmi>30?25*h*h:o.weight; // przy otyłości białko liczone od wagi „docelowej”
  const p=Math.round(refW*(o.goal.startsWith('cut')?2:1.8)), f=Math.round(kcal*0.27/9), c=Math.max(0,Math.round((kcal-p*4-f*9)/4));
  const weekly=(kcal-tdee)*7/7700;
  let weeks=null; if(o.target&&weekly&&Math.sign(o.target-o.weight)===Math.sign(weekly)) weeks=Math.ceil((o.target-o.weight)/weekly);
  return {bmi,bmr,tdee,kcal,p,c,f,weekly,weeks,limited};
}
function readCalc(){ return {sex:$('#sSex').value,age:num($('#sAge').value),height:num($('#sH').value),weight:num($('#sW').value),
  activity:num($('#sAct').value),goal:$('#sGoal').value,target:num($('#sTarget').value)||null}; }
function bmiLabel(b){ return b<18.5?'niedowaga':b<25?'waga prawidłowa':b<30?'nadwaga':'otyłość'; }
function updateCalc(){
  const out=$('#calcOut'); if(!out) return; const o=readCalc();
  if(!(o.weight>30&&o.height>100&&o.age>=12)){ out.innerHTML='<p class="small muted">Uzupełnij wagę, wzrost i wiek.</p>'; return; }
  const P=computePlan(o);
  const opts=['cut_slow','cut','cut_fast'].map(g=>{ const x=computePlan({...o,goal:g}); return `<div class="stat" style="padding:8px;border:1px solid ${g===o.goal?'var(--accent)':'var(--line)'};border-radius:10px">
    <b>${x.kcal}</b><span class="small muted">kcal · ${(Math.round(x.weekly*100)/100).toString().replace('.',',')} kg/tydz.</span></div>`; }).join('');
  const date=P.weeks?new Date(Date.now()+P.weeks*7*864e5).toLocaleDateString('pl-PL',{month:'long',year:'numeric'}):'';
  out.innerHTML=`<div style="background:var(--bg);border-radius:12px;padding:12px;margin:4px 0 8px">
    <div class="small muted">Twój dzienny limit</div>
    <div class="big" style="color:var(--accent)">${P.kcal} kcal</div>
    <div class="small">Białko <b>${P.p} g</b> · Węglowodany <b>${P.c} g</b> · Tłuszcze <b>${P.f} g</b></div>
    <div class="small muted" style="margin-top:6px">BMI ${r1(P.bmi)} (${bmiLabel(P.bmi)}) · przemiana podstawowa ${r0(P.bmr)} kcal · utrzymanie wagi ${r0(P.tdee)} kcal</div>
    ${P.weekly?`<div class="small" style="margin-top:6px">Tempo: ok. <b>${P.weekly>0?'+':''}${r1(P.weekly).toString().replace('.',',')} kg</b> na tydzień${P.weeks?` → ${o.target} kg za ok. <b>${P.weeks} tyg.</b> (${date})`:''}</div>`:''}
    ${P.limited?'<div class="small" style="color:var(--warn);margin-top:6px">Limit podniesiony do bezpiecznego minimum – niżej nie warto schodzić bez opieki lekarza.</div>':''}
  </div>
  ${o.goal.startsWith('cut')?`<div class="small muted" style="margin-bottom:4px">Porównanie tempa odchudzania:</div><div class="grid2" style="grid-template-columns:repeat(3,1fr)">${opts}</div>`:''}`;
}
function calcTargets(){
  const o=readCalc(); if(!(o.weight>30&&o.height>100&&o.age>=12)) return toast('Uzupełnij wagę, wzrost i wiek.');
  const P=computePlan(o);
  Object.assign(S.settings,o,{kcal:P.kcal,p:P.p,c:P.c,f:P.f,autoCalc:$('#sAuto').checked,profileSet:true}); save();
  render(); toast(`✅ Ustawiono: ${P.kcal} kcal dziennie (B ${P.p} g, W ${P.c} g, T ${P.f} g).`);
}

document.addEventListener('click',e=>{

  switch(d.act){

    case 'dayNext': dietDay=addDays(dietDay,1); render(); break;
    case 'addMeal': mealDialog(d.type); break;
    case 'editMeal': mealDialog(null,(S.meals[dietDay]||[]).find(m=>m.id===d.id)); break;
    case 'delMeal': S.meals[dietDay]=(S.meals[dietDay]||[]).filter(m=>m.id!==d.id); save(); render(); break;
    case 'copyYesterday': { const src=S.meals[addDays(dietDay,-1)]||[]; if(!src.length){toast('Poprzedni dzień jest pusty.');break;}

    case 'manageFoods': foodsDialog(); break;
    case 'startEmpty': startWorkout('Trening '+new Date().toLocaleDateString('pl-PL',{weekday:'long'}),[]); break;
    case 'startTpl': { const t=S.templates[+d.i]; startWorkout(t.name,t.exercises); break; }
    case 'delTpl': ask('Usunąć szablon „'+S.templates[+d.i].name+'”?',{ok:'Usuń',danger:true}).then(ok=>{ if(ok){ S.templates.splice(+d.i,1); save(); render(); } }); break;
    case 'viewWorkout': workoutDetails(d.id); break;
    case 'addEx': { const n=$('#exIn').value.trim(); if(!n) return $('#exIn').focus();
      if(!S.exercises.includes(n)) S.exercises.push(n);
      const prev=[...S.workouts].sort((x,y)=>y.end-x.end).flatMap(w=>w.exercises).find(e=>e.name===n);
      a.exercises.push({name:n,sets:prev?prev.sets.map(s=>({reps:s.reps,weight:s.weight,done:false})):[{reps:'',weight:'',done:false}]}); save(); render(); break; }

    case 'addSet': { const sets=a.exercises[+d.ei].sets, l=sets[sets.length-1]; sets.push({reps:l?l.reps:'',weight:l?l.weight:'',done:false}); save(); render(); break; }

    case 'doneSet': { const s=a.exercises[+d.ei].sets[+d.si]; s.done=!s.done; save(); render(); break; }
    case 'saveTpl': { if(!a.exercises.length) return toast('Dodaj najpierw ćwiczenia.');
      ask('Nazwa szablonu:',{ok:'Zapisz',input:a.name}).then(name=>{ if(!name) return;
        S.templates.push({name,exercises:a.exercises.map(e=>e.name)}); save(); toast('✅ Zapisano szablon „'+name+'”.'); }); break; }
    case 'cancelWorkout': ask('Anulować trening? Dane z tej sesji zostaną utracone.',{ok:'Anuluj trening',cancel:'Wróć',danger:true}).then(ok=>{ if(ok){ S.active=null; save(); render(); toast('Trening anulowany.'); } }); break;
    case 'finishWorkout': {
      const ex=a.exercises.map(e=>({name:e.name,sets:e.sets.filter(s=>num(s.reps)>0)})).filter(e=>e.sets.length);
      if(!ex.length){ ask('Żadna seria nie ma wpisanych powtórzeń, więc nie ma czego zapisać. Zakończyć trening bez zapisywania?',{ok:'Zakończ bez zapisu',cancel:'Wróć',danger:true}).then(ok=>{ if(ok){S.active=null;save();render();} }); break; }
      S.workouts.push({id:a.id,name:a.name||'Trening',date:dkey(new Date(a.start)),start:a.start,end:Date.now(),notes:a.notes,exercises:ex});

    case 'addWeight': if(addWeight($('#wDate').value||k,num($('#wKg').value))) render(); break;

    case 'export': { const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); const u=URL.createObjectURL(blob);
      const l=document.createElement('a'); l.href=u; l.download='fitapp-kopia-'+k+'.json'; l.click(); setTimeout(()=>URL.revokeObjectURL(u),1000); break; }
    case 'import': $('#impFile').click(); break;
    case 'reset': ask('Na pewno usunąć WSZYSTKIE dane? Tego nie da się cofnąć.',{ok:'Usuń wszystko',danger:true}).then(ok=>{ if(ok){ try{localStorage.removeItem(KEY);}catch(e){} S=norm(load()); render(); toast('Usunięto wszystkie dane.'); } }); break;
  }
});
// pola treningu – zapis bez przerysowania (żeby nie tracić fokusu)
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.closest('#calcCard')) return updateCalc();
  if(!S.active) return;
  if(t.dataset.f){ S.active.exercises[+t.dataset.ei].sets[+t.dataset.si][t.dataset.f]=t.value; save(); }
  else if(t.dataset.wf){ S.active[t.dataset.wf]=t.value; save(); }
});
document.addEventListener('change',e=>{
  if(e.target.id!=='impFile') return; const f=e.target.files[0]; if(!f) return;
  f.text().then(txt=>{ const d=JSON.parse(txt); if(!d.settings||!d.meals) throw new Error('To nie jest kopia FitApp');
    return ask('Zastąpić obecne dane danymi z kopii?',{ok:'Zastąp'}).then(ok=>{ if(ok){ S=norm(d); save(); render(); toast('✅ Zaimportowano.'); } });
  }).catch(err=>toast('Błąd importu: '+err.message,5000)).finally(()=>{ e.target.value=''; });
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='exIn'){ e.preventDefault(); document.querySelector('[data-act="addEx"]').click(); }
});

/* ================== INSTALACJA NA TELEFONIE (PWA) ================== */
let installEvt=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; if(tab==='settings') render(); });
window.addEventListener('appinstalled',()=>{ installEvt=null; toast('✅ FitApp zainstalowana!'); });
function installCard(){
  if(isStandalone()) return '';
  return `<div class="card"><h2>📱 Zainstaluj na telefonie</h2>
    ${installEvt?`<p class="small muted" style="margin-top:0">Dodaj FitApp do ekranu głównego – będzie działać jak zwykła aplikacja, także offline.</p>
      <button class="primary" style="width:100%" data-act="install">Zainstaluj aplikację</button>`
    :isIOS?`<p class="small" style="margin-top:0">W Safari stuknij <b>Udostępnij</b> (kwadrat ze strzałką) → <b>Do ekranu początkowego</b>.</p>`
    :`<p class="small" style="margin-top:0">W Chrome na Androidzie: menu <b>⋮</b> → <b>Dodaj do ekranu głównego</b> / <b>Zainstaluj aplikację</b>.</p>`}
  </div>`;
}
document.addEventListener('click',async e=>{
  if(!e.target.closest('[data-act="install"]')||!installEvt) return;
  installEvt.prompt(); await installEvt.userChoice; installEvt=null; render();
});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))
  navigator.serviceWorker.register('sw.js').catch(()=>{});

render();
// ekran ładowania: krótko pokaż logo, potem płynnie wejdź do aplikacji
(function(){
  const sp=$('#splash'), reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(()=>{ sp.classList.add('hide'); animateApp('fwd'); setTimeout(()=>sp.remove(),500); }, reduce?150:1100);
})();
</script>
</body>
</html>
